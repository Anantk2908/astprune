# Settings for experiments/evaluate.py. Command-line flags override these.
# Everything that affects a number in results/ is written down here.

tokenizer: cl100k_base          # one token counter for budgets and compression, all methods

# Token budgets. Relative budgets are a share of the candidate files' tokens.
# Fixed budgets only count issues whose candidate files are larger than the budget.
budgets:
  relative: [0.10, 0.25, 0.50]
  fixed: [1000, 2000, 4000]

# Candidate file settings.
#   oracle          files the gold patch edits
#   oracle_imports  those files plus the files they import directly (max 15)
#   bm25_K          top-K files from BM25 over the repository, test files excluded
settings: [oracle, oracle_imports, bm25_5, bm25_10, bm25_20]
primary_setting: oracle_imports

# Selector used by every ast_* method unless the method name says otherwise.
selector:
  sig_tier: true
  sig_reserve: 0.0              # share of the budget held back for signatures
  order: score

models:
  base_encoder: microsoft/unixcoder-base
  trained_checkpoint: checkpoints/ranker/best      # written by experiments/train_ranker.py
  max_query_tokens: 512
  max_node_tokens: 256

# Training-free perplexity scorer (LongCodeZip's ranking criterion, our own code).
# LongCodeZip's paper uses a 7B model; this is what fits next to everything else on 8 GB.
perplexity:
  model: Qwen/Qwen2.5-Coder-1.5B-Instruct
  max_query_tokens: 256
  max_node_tokens: 384

# Official third-party baselines. They need extra installs, see the module docstrings.
longcodezip:
  model: Qwen/Qwen2.5-Coder-1.5B-Instruct
swe_pruner:
  checkpoint: checkpoints/swe_pruner

# Methods run by default. Names are resolved in src/astprune/registry.py.
methods:
  untrained: [line_window, chunk_bm25, chunk_unixcoder, skeleton, ast_random, ast_bm25, ast_unixcoder]
  trained: [ast_trained, ast_hybrid]
  perplexity: [ast_ppl]
  external: [longcodezip_rank, longcodezip, swe_pruner]
  ablations: [ast_trained_nosig, ast_trained_sig15, ast_trained_sig30, ast_trained_density, ast_trained_perfile,
              ast_bm25_nosig, ast_bm25_perfile]

# Comparisons named before looking at test results. Each is "A minus B" on
# gold-function recall, paired over issues. Everything else is exploratory.
comparisons:
  H1_granularity:
    - [ast_bm25, line_window]
    - [ast_bm25, chunk_bm25]
    - [ast_unixcoder, chunk_unixcoder]
  H2_training:
    - [ast_trained, ast_unixcoder]
    - [ast_trained, ast_bm25]
    - [ast_hybrid, ast_bm25]
    - [ast_trained, ast_ppl]

bootstrap:
  resamples: 10000
  seed: 20261113
  level: 0.95
